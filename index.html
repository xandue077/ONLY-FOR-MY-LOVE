<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Love Test 💜</title>
  <meta name="description" content="A cute interactive love test." />
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <main class="app" id="app">
    <div class="sparkles" aria-hidden="true"></div>

    <div class="corner-heart" aria-hidden="true">♡</div>
    <div class="plane" aria-hidden="true">
      <span class="plane-shape">➤</span>
      <span class="trail">♡</span>
    </div>

    <section class="card" id="testScreen">
      <div class="hero-gif-wrap"><img class="hero-gif" src="assets/cute-love.gif" alt="Cute animated love bunny" /></div>
      <div class="character" id="character" aria-hidden="true">
        <div class="cat-ear left"></div><div class="cat-ear right"></div>
        <div class="cat-face">
          <span class="eye e1"></span><span class="eye e2"></span>
          <span class="nose">♥</span>
          <span class="cheek c1"></span><span class="cheek c2"></span>
          <span class="paw p1">♡</span><span class="paw p2">♡</span>
        </div>
      </div>

      <p class="eyebrow">A tiny question for you</p>
      <h1 id="question">How much do you love me?</h1>
      <div class="percent" id="percent">0%</div>

      <div class="gauge-wrap" aria-hidden="true">
        <div class="gauge">
          <div class="gauge-fill" id="gaugeFill"></div>
          <div class="gauge-inner"><span>love</span><b>♡</b></div>
        </div>
        <div class="gauge-heart left">♡</div>
        <div class="gauge-heart right">♡</div>
      </div>

      <label class="slider-label" for="loveRange">Choose your answer</label>
      <input id="loveRange" type="range" min="0" max="100" value="0" aria-label="How much do you love me?" />
      <div class="range-values"><span>0</span><span>100</span></div>

      <button class="action" id="answerBtn">That's my answer 💜</button>
      <p class="hint" id="hint">Slide it to your honest answer.</p>
    </section>

    <section class="result hidden" id="resultScreen">
      <div class="result-character" aria-hidden="true">૮ ˶ᵔ ᵕ ᵔ˶ ა</div>
      <p class="eyebrow">Love test complete</p>
      <h2 id="resultTitle">You passed the love test 💜</h2>
      <p id="resultText">Your little surprises are waiting for you.</p>
      <div class="gifts">
        <button class="gift" data-gift="A hug is waiting for you!">🎁<span>Open</span></button>
        <button class="gift" data-gift="You deserve a million kisses!">🎀<span>Open</span></button>
        <button class="gift" data-gift="One secret surprise just for you ✨">💝<span>Open</span></button>
      </div>
      <button class="action secondary" id="againBtn">Try again ↻</button>

      <div class="qr-card">
        <p class="qr-title">Share the love 💜</p>
        <div id="qrcode" class="qr-code" aria-label="QR code for this website"></div>
        <p class="qr-note">Scan to open this page</p>
      </div>
    </section>

    <div class="toast" id="toast" role="status"></div>
    <footer class="credit">made by <strong>xandue</strong> ♡</footer>
  </main>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
